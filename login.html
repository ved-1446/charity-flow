<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | Charity Flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <style>
    :root {
      --primary-color: #1d3557;
      --secondary-color: #e63946;
      --accent-color: #457b9d;
      --bg-overlay: rgba(0, 0, 0, 0.6);
    }

    body {
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(var(--bg-overlay), var(--bg-overlay)),
        url('https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?w=1950&q=80') center/cover no-repeat;
    }

    .login-container {
      background-color: rgba(255, 255, 255, 0.95);
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
      backdrop-filter: blur(5px);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: var(--primary-color);
      font-weight: 700;
      font-size: 1.8rem;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--primary-color);
      font-weight: 600;
      font-size: 0.9rem;
    }

    .form-group input[type="email"],
    .form-group input[type="password"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1.5px solid #d1d9e6;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.3s;
      box-sizing: border-box;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background-color: var(--accent-color);
      border: none;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 1rem;
      transition: background 0.3s, transform 0.2s;
    }

    .login-btn:hover {
      background-color: var(--primary-color);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h2>Charity Flow</h2>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="e.g. name@example.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
      </div>

      <button class="login-btn" type="submit">Secure Login</button>
    </form>
  </div>

  <script>
    // Redirect if already authenticated
    if (getToken()) {
      if (getRole() === "admin") {
        window.location.href = "admin.html";
      } else {
        window.location.href = "frontend.html";
      }
    }

    document.getElementById("loginForm").addEventListener("submit", async function (event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const btn = document.querySelector('.login-btn');
      const originalText = btn.textContent;
      btn.textContent = "Loading...";
      btn.disabled = true;

      try {
        const response = await apiFetch("/auth/login", {
          method: "POST",
          body: { email: email, password: password }
        });

        const result = await response.json().catch(() => ({}));
        btn.textContent = originalText;
        btn.disabled = false;

        if (response.ok && result.token) {
          localStorage.setItem("charityToken", result.token);
          localStorage.setItem("userRole", result.role);
          localStorage.setItem("userEmail", result.email);

          if (result.role === "admin") {
            window.location.href = "admin.html";
          } else {
            window.location.href = "frontend.html";
          }
        } else {
          showToast(result.detail || result.message || "Invalid credentials. Please try again.", "error");
        }
      } catch (error) {
        console.error("Login Error:", error);
        btn.textContent = originalText;
        btn.disabled = false;
        showToast("Something went wrong connecting to the server. Please try again.", "error");
      }
    });
  </script>

</body>
</html>
